<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Scry system architecture</title><desc id="desc">The web console connects to Query Service and Agent Service. The agent connects to model endpoints, runtime storage and MCP tools. OpenTelemetry feeds ClickHouse. MCP tools access query APIs and controlled SSH or remote plugins. Auxiliary services are omitted.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151d30"/><stop offset="1" stop-color="#0e1320"/></linearGradient><linearGradient id="accent"><stop stop-color="#f16bab"/><stop offset="1" stop-color="#f9db88"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c9db6"/></marker></defs>
<rect width="1200" height="850" rx="24" fill="url(#bg)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">

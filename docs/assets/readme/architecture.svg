<text x="50" y="92" font-size="32" fill="#f2f5fc" font-weight="700" text-anchor="start">One workspace. Clear service boundaries.</text>
<text x="50" y="124" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Core services and data paths; auxiliary infrastructure is omitted for clarity.</text>

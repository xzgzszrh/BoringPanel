<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855" role="img" aria-labelledby="title desc">
<title id="title">Policy, approval and least-privilege execution</title><desc id="desc">Input scanning and intent classification determine allow, require-approval or deny. Tool approval is created by the runtime. Tool arguments and commands are checked again before execution. A controlled scry-ops action or read-only tool is followed by verification and traceId-linked auditing.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151d30"/><stop offset="1" stop-color="#0e1320"/></linearGradient><linearGradient id="accent"><stop stop-color="#f16bab"/><stop offset="1" stop-color="#f9db88"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c9db6"/></marker></defs>
<rect width="1200" height="855" rx="24" fill="url(#bg)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<text x="50" y="47" font-size="14" fill="#f16bab" font-weight="700" text-anchor="start">SCRY / 03</text>
<text x="50" y="92" font-size="32" fill="#f2f5fc" font-weight="700" text-anchor="start">Reason freely. Execute within explicit boundaries.</text>
<text x="50" y="124" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Service-side checks, human approval and host permissions constrain each action.</text>
<rect x="385" y="163" width="430" height="99" rx="16" fill="#192132" stroke="#354257"/>
<rect x="385" y="181" width="4" height="63" rx="2" fill="#f16bab"/>
<text x="409" y="199" font-size="23" fill="#f2f5fc" font-weight="650" text-anchor="start">Input + intent checks</text>
<text x="409" y="230" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Injection scan · Risk classification</text>
<text x="409" y="256" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Server-side policy decision</text>
<path d="M385 225 H215 V310" fill="none" stroke="#8c9db6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M600 262 V310" fill="none" stroke="#8c9db6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M815 225 H1005 V310" fill="none" stroke="#8c9db6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="311" width="330" height="111" rx="16" fill="#192132" stroke="#354257"/>
<rect x="50" y="329" width="4" height="75" rx="2" fill="#f16bab"/>
<text x="74" y="347" font-size="23" fill="#f2f5fc" font-weight="650" text-anchor="start">DENY</text>
<text x="74" y="378" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Reject the request</text>
<text x="74" y="404" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Record the reason</text>
<rect x="435" y="311" width="330" height="111" rx="16" fill="#192132" stroke="#354257"/>
<rect x="435" y="329" width="4" height="75" rx="2" fill="#f9db88"/>
<text x="459" y="347" font-size="23" fill="#f2f5fc" font-weight="650" text-anchor="start">REQUIRE APPROVAL</text>
<text x="459" y="378" font-size="17.606850577204487" fill="#adbad0" font-weight="400" text-anchor="start">Runtime creates a tool approval</text>
<text x="459" y="404" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Bind target + parameters</text>
<rect x="820" y="311" width="330" height="111" rx="16" fill="#192132" stroke="#354257"/>
<rect x="820" y="329" width="4" height="75" rx="2" fill="#65dcc4"/>
<text x="844" y="347" font-size="23" fill="#f2f5fc" font-weight="650" text-anchor="start">ALLOW</text>
<text x="844" y="378" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Proceed to tool checks</text>
<text x="844" y="404" font-size="15.499976143899994" fill="#adbad0" font-weight="400" text-anchor="start">Example: permitted read-only query</text>
<path d="M600 422 V506" fill="none" stroke="#8c9db6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="617" y="472" font-size="16" fill="#f9db88" font-weight="400" text-anchor="start">Approved</text>
<path d="M435 381 H383" fill="none" stroke="#f16bab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="390" y="354" font-size="14" fill="#f16bab" font-weight="400" text-anchor="start">No</text>
<path d="M1005 422 V466 H760 V506" fill="none" stroke="#8c9db6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="385" y="507" width="430" height="104" rx="16" fill="#192132" stroke="#354257"/>
<rect x="385" y="525" width="4" height="68" rx="2" fill="#83b8ff"/>
<text x="409" y="543" font-size="23" fill="#f2f5fc" font-weight="650" text-anchor="start">Tool + command checks</text>
<text x="409" y="574" font-size="17.464243193904277" fill="#adbad0" font-weight="400" text-anchor="start">Schema · Authorization · Parameter binding</text>
<text x="409" y="600" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Recheck policy before execution</text>
<path d="M385 556 H215 V424" fill="none" stroke="#f16bab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="72" y="513" font-size="16" fill="#f16bab" font-weight="400" text-anchor="start">Invalid / denied</text>
<path d="M600 611 V650" fill="none" stroke="#8c9db6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="385" y="651" width="430" height="104" rx="16" fill="#192132" stroke="#354257"/>
<rect x="385" y="669" width="4" height="68" rx="2" fill="#65dcc4"/>
<text x="409" y="687" font-size="23" fill="#f2f5fc" font-weight="650" text-anchor="start">Controlled execution</text>
<text x="409" y="718" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">scry-ops wrapper or permitted query tool</text>
<text x="409" y="744" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Verify the result and retain evidence</text>
<rect x="50" y="651" width="288" height="104" rx="16" fill="#231e2b" stroke="#5a3449"/>
<text x="74" y="684" font-size="16" fill="#f16bab" font-weight="700" text-anchor="start">HOST BOUNDARY</text>
<text x="74" y="714" font-size="17" fill="#adbad0" font-weight="400" text-anchor="start">Non-root · ForceCommand</text>
<text x="74" y="739" font-size="17" fill="#adbad0" font-weight="400" text-anchor="start">Fixed wrappers · Allowlist</text>
<rect x="862" y="507" width="288" height="248" rx="16" fill="#1d2431" stroke="#455060"/>
<text x="886" y="543" font-size="19" fill="#f9db88" font-weight="700" text-anchor="start">AUDIT TRAIL</text>
<text x="886" y="580" font-size="17" fill="#adbad0" font-weight="400" text-anchor="start">traceId links the stages</text>
<text x="886" y="611" font-size="17" fill="#adbad0" font-weight="400" text-anchor="start">Input and policy decisions</text>
<text x="886" y="642" font-size="17" fill="#adbad0" font-weight="400" text-anchor="start">Approval and execution</text>
<text x="886" y="673" font-size="17" fill="#adbad0" font-weight="400" text-anchor="start">Errors and verification</text>
<path d="M815 558 H860" fill="none" stroke="#8c9db6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<path d="M815 701 H860" fill="none" stroke="#8c9db6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
<text x="50" y="816" font-size="18" fill="#adbad0" font-weight="400" text-anchor="start">Approval is enforced by the tool runtime; an AI response is not an execution authorization.</text></g></svg>

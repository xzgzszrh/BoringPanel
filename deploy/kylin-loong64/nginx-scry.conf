server {
    listen 80;
    server_name _;
    root /opt/scry/frontend;
    index index.html;

    location /agent-api/ {
        rewrite ^/agent-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4111;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
